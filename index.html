<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f0e9" />
    <meta
      name="description"
      content="A personal note for Shade."
    />
    <title>A note for Shade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <main class="page">
      <div class="letter" id="letter">
        <div class="letter-top">
          <span class="letter-mark" aria-hidden="true">s.</span>
          <span class="letter-date">A note, just for you</span>
        </div>
        <div id="experience" aria-live="polite" aria-atomic="true"></div>
        <footer class="letter-footer">
          <span>Take all the time you need.</span>
          <span class="footer-sparkle" aria-hidden="true">✳</span>
        </footer>
      </div>
      <p class="page-note">A quiet moment, with no expectation.</p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
